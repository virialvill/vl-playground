<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deal · Recruitment Tracker 2026-Q1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css?v=1">
  <link rel="stylesheet" href="assets/css/app.css?v=1">
</head>
<body>
  <main class="page stack" id="page"></main>

  <!-- Filtros de la tabla de aplicaciones -->
  <dialog class="modal" id="app-filters">
    <form class="modal__inner" method="dialog">
      <div class="modal__header">
        <h2 class="modal__title">Filters</h2>
        <button class="modal__close" type="button" data-close aria-label="Cerrar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <p class="modal__group-title">Process Information</p>
      <div class="form-grid">
        <label class="field"><span class="field__label">Selection Result Email Template</span>
          <select class="select" id="af-template"><option value="">Select</option></select></label>
        <label class="field"><span class="field__label">Current Job Stage</span>
          <select class="select" id="af-stage"><option value="">Select</option></select></label>
        <label class="field"><span class="field__label">Other Job Status</span>
          <select class="select" id="af-other"><option value="">Select</option></select></label>
      </div>

      <p class="modal__group-title" style="margin-top:20px">VA Information</p>
      <div class="form-grid">
        <label class="field"><span class="field__label">Country of Origin</span>
          <select class="select" id="af-country"><option value="">Select</option></select></label>
        <label class="field"><span class="field__label">Academic Degree</span>
          <select class="select" id="af-degree"><option value="">Select</option></select></label>
        <label class="field"><span class="field__label">Total Years of Experience</span>
          <select class="select" id="af-exp"><option value="">Select</option></select></label>
      </div>

      <p class="modal__group-title" style="margin-top:20px">Rates &amp; Interview</p>
      <div class="form-grid">
        <label class="field"><span class="field__label">VA Rate</span>
          <select class="select" id="af-rate">
            <option value="">Select</option><option>$6 - $10</option><option>$10 - $14</option><option>$14 - $20</option>
          </select></label>
        <label class="field"><span class="field__label">Client Rate Sent</span>
          <select class="select" id="af-client-rate">
            <option value="">Select</option><option>$10 - $14</option><option>$14 - $20</option>
          </select></label>
        <label class="field"><span class="field__label">Last Interview Date</span>
          <input class="input" id="af-date" type="date"></label>
      </div>

      <div class="modal__footer">
        <button class="btn btn--outline" type="button" id="af-reset">Reset</button>
        <button class="btn btn--primary" type="button" id="af-apply">Apply Filter</button>
      </div>
    </form>
  </dialog>

  <!-- Confirmación de cierre de job post -->
  <dialog class="modal modal--sm" id="close-job">
    <div class="modal__inner">
      <div class="modal__header">
        <h2 class="modal__title">Close this job post?</h2>
      </div>
      <p class="muted">Applicants will no longer be able to apply. You can reopen it later from Job Details.</p>
      <div class="modal__footer">
        <button class="btn btn--neutral" type="button" data-close>Cancel</button>
        <button class="btn btn--danger" type="button" id="confirm-close">Close Job Post</button>
      </div>
    </div>
  </dialog>

  <script src="assets/js/data.js?v=1"></script>
  <script src="assets/js/app.js?v=1"></script>
  <script>
  (function () {
    const D = window.VLTData;
    const { esc, icon, badge, avatar, pageHeader, dataTable, modal, toast, formatDate, param } = VLT;

    const dealId = param("id", D.dealDetail.id);
    const deal = D.deals.find((d) => d.id === dealId) || D.deals[0];
    const detail = D.dealDetail;

    /* --- Helpers de presentación ------------------------------------------ */
    const detailItem = (item) => `
      <div>
        <div class="detail__label">${esc(item.label)}</div>
        <div class="detail__value">${Array.isArray(item.value)
          ? `<ul>${item.value.map((v) => `<li>${esc(v)}</li>`).join("")}</ul>`
          : esc(item.value)}</div>
      </div>`;

    const detailBlock = (title, items, cols = 3) => `
      <section>
        <h3 class="section-title">${esc(title)}</h3>
        <div class="detail-grid${cols === 2 ? " detail-grid--2" : ""}">
          ${items.map(detailItem).join("")}
        </div>
      </section>`;

    /* --- Tab 1: Deal Details ---------------------------------------------- */
    const dealDetailsPanel = `
      <div class="card card--pad stack">
        <section>
          <h3 class="section-title">Links to Forms</h3>
          <div class="link-row">
            ${detail.forms.map((f) => `
              <a class="link-external" href="${f.href}">${esc(f.label)} ${icon("external", 14)}</a>`).join("")}
          </div>
        </section>
        ${detailBlock("Deal Information", detail.information)}
        ${detailBlock("Timeline & Pay", detail.timeline)}
        ${detailBlock("Client Contact Information", detail.client)}
        ${detailBlock("Team Members", detail.team)}
      </div>`;

    /* --- Tab 2: Intake Form ------------------------------------------------ */
    const intakePanel = `
      <div class="card card--pad stack">
        ${detailBlock("Intake Summary", [
          { label: "Form ID", value: "IF-1042" },
          { label: "Submitted", value: "Apr 22, 2025" },
          { label: "Status", value: "Completed" },
          { label: "Client", value: "Jessica Wilson" },
          { label: "Company", value: "Tech Innovators Inc." },
          { label: "Industry", value: "SaaS & Technology" },
        ])}
        ${detailBlock("Role Requirements", [
          { label: "Primary Role", value: "Product Manager" },
          { label: "Hours Per Week", value: "50" },
          { label: "Time Zone", value: "9 am - 1 pm PST" },
          { label: "Openings", value: "2" },
          { label: "Schedule", value: "Monday to Friday" },
          { label: "Start Date", value: "2025-06-01" },
        ])}
        <p class="muted text-xs">
          Nota: esta pestaña no tiene pantalla propia en el archivo de Figma; se armó con los mismos
          componentes de “Deal Details” a partir de los campos del intake.
        </p>
      </div>`;

    /* --- Tab 3: Job Details ------------------------------------------------ */
    const emptyArt = `
      <svg width="240" height="240" viewBox="0 0 240 240" fill="none" aria-hidden="true">
        <g transform="rotate(-12 120 120)">
          <rect x="46" y="60" width="96" height="126" rx="10" fill="#e3f6ee" stroke="#0e9f6e" stroke-width="1.5"/>
          <rect x="74" y="48" width="40" height="16" rx="6" fill="#1f2a3d"/>
          <circle cx="94" cy="42" r="6" fill="#fff" stroke="#1f2a3d" stroke-width="2"/>
        </g>
        <rect x="98" y="78" width="100" height="130" rx="10" fill="#fff" stroke="#0e9f6e" stroke-width="1.5"/>
        <rect x="112" y="92" width="72" height="102" rx="6" fill="#e3f6ee"/>
        <rect x="128" y="66" width="42" height="17" rx="6" fill="#1f2a3d"/>
        <circle cx="149" cy="60" r="6" fill="#fff" stroke="#1f2a3d" stroke-width="2"/>
      </svg>`;

    const jobEmpty = `
      <div class="card card--pad">
        <div class="empty-state">
          <div class="empty-state__art">${emptyArt}</div>
          <p class="empty-state__title">No job post has been created for this position.</p>
          <p class="empty-state__text">Start by adding one to define the role and begin the matching process.</p>
          <a class="btn btn--primary" href="job-post.html?id=${esc(deal.id)}">Create Job Post</a>
        </div>
      </div>`;

    const jobCreated = `
      <div class="card card--pad stack">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <h3 class="h3">Main Job Details</h3>
          ${badge("Published", "success", true)}
          <div class="table-toolbar__spacer"></div>
          <a class="btn btn--outline" href="job-post.html?id=${esc(deal.id)}&mode=edit">Update Job Post</a>
          <button class="btn btn--danger" type="button" id="close-job-btn">Close Job Post</button>
        </div>
        ${detailBlock("Job Post", [
          { label: "Job Post Title", value: "Administrative Assistant — Part-time" },
          { label: "Job ID", value: "JP-88213" },
          { label: "Application Type", value: "Assessment Based" },
          { label: "VA Level", value: "Professional (3-5 years)" },
          { label: "Job Opening Deadline", value: "2025-05-30" },
          { label: "Date to Hide Job On", value: "2025-06-15" },
        ])}
        ${detailBlock("Budget", [
          { label: "Number of VAs", value: "2" },
          { label: "Client Rate", value: "$11 – $20 USD" },
          { label: "VA Rate", value: "$7 – $11 USD" },
        ])}
      </div>`;

    const jobPosted = localStorage.getItem("vlt-job-posted") === "1";

    /* --- Tab 4: Job Applications Table ------------------------------------- */
    const applicationsPanel = `
      <div class="stack">
        <div class="bulk-bar" id="bulk-bar" hidden>
          <span class="bulk-bar__count" id="bulk-count">0 VAs selected</span>
          <button class="btn btn--ghost btn--sm" type="button" id="bulk-clear">Clear Selection</button>
          <div class="bulk-bar__end">
            <span class="label">Current Job Stage</span>
            <select class="select" id="bulk-stage" style="width:220px">
              <option value="">Select stage</option>
              ${D.options.jobStage.map((s) => `<option>${esc(s)}</option>`).join("")}
            </select>
            <button class="btn btn--primary" type="button" id="bulk-apply">Apply to Selected</button>
          </div>
        </div>

        <div class="card card--pad">
          <div class="table-toolbar">
            <div class="field">
              <span class="field__label">Search Deals</span>
              <span class="search">${icon("search", 16)}
                <input class="input" id="app-search" type="search"
                       placeholder="Enter VA name, telegram user, or email">
              </span>
            </div>
            <button class="btn btn--outline" type="button" id="open-app-filters">
              Filters ${icon("filter", 14)}
            </button>
            <button class="btn btn--outline" type="button" id="download-csv">
              Download CSV ${icon("download", 14)}
            </button>
            <div class="table-toolbar__spacer"></div>
            <span class="pill-count">Number of Proposals: 10</span>
          </div>
          <div id="app-table"></div>
        </div>
      </div>`;

    /* --- Tab 5: Agreement Creation ----------------------------------------- */
    const agreementsPanel = `
      <div class="card card--pad">
        <div class="table-toolbar">
          <div class="field">
            <span class="field__label">Search</span>
            <span class="search">${icon("search", 16)}
              <input class="input" id="agr-search" type="search" placeholder="Enter Agreement name">
            </span>
          </div>
          <div class="table-toolbar__spacer"></div>
          <a class="btn btn--primary" href="agreement.html?id=${esc(deal.id)}">Create Agreement</a>
        </div>
        <div id="agr-table"></div>
      </div>`;

    /* --- Montaje ------------------------------------------------------------ */
    const TABS = [
      { id: "tab-details",  label: "Deal Details",          panel: dealDetailsPanel },
      { id: "tab-intake",   label: "Intake Form",           panel: intakePanel },
      { id: "tab-job",      label: "Job Details",           panel: jobPosted ? jobCreated : jobEmpty },
      { id: "tab-apps",     label: "Job Applications Table", panel: applicationsPanel },
      { id: "tab-agreement", label: "Agreement Creation",   panel: agreementsPanel },
    ];

    const wanted = { details: "tab-details", intake: "tab-intake", job: "tab-job",
                     apps: "tab-apps", agreement: "tab-agreement" }[param("tab", "details")] || "tab-details";

    document.getElementById("page").innerHTML = `
      ${pageHeader({
        title: deal.name,
        subtitle: detail.applicationType,
        breadcrumb: [{ label: "Home", href: "dashboard.html" }, { label: "Deals", href: "deals.html" }],
      })}

      <div data-tabs>
        <div class="tabs" role="tablist">
          ${TABS.map((t) => `
            <button class="tab" role="tab" type="button" data-tab="${t.id}"
                    aria-selected="${t.id === wanted}">${esc(t.label)}</button>`).join("")}
        </div>
        ${TABS.map((t) => `
          <div class="tab-panel" id="${t.id}" role="tabpanel" style="padding-top:24px"
               ${t.id === wanted ? "" : "hidden"}>${t.panel}</div>`).join("")}
      </div>`;

    /* --- Tabla de aplicaciones --------------------------------------------- */
    const statusTone = { Completed: "success", "In Progress": "warning", "Not Started": "neutral" };

    const appTable = dataTable({
      mount: document.getElementById("app-table"),
      rows: D.applications,
      selectable: true,
      pageSize: 8,
      searchFn: (r, t) => (r.name + " " + r.email).toLowerCase().includes(t),
      columns: [
        { key: "name", label: "VA Name", sortable: true, render: (r) => `
          <div style="display:flex;align-items:center;gap:10px">
            ${avatar("", "")}
            <div>
              <a class="cell-link" href="candidate.html?va=${esc(r.id)}">${esc(r.name)}</a>
              <div class="muted text-xs">${esc(r.email)}</div>
            </div>
          </div>` },
        { key: "submitted", label: "Original Submission Date" },
        { key: "modified",  label: "Last Modified Date" },
        { key: "assessment", label: "Assessment Title", sortable: true },
        { key: "score", label: "Assessment Score", sortable: true, render: (r) => `${r.score}%` },
        { key: "status", label: "Assessment Status", sortable: true,
          render: (r) => badge(r.status, statusTone[r.status] || "neutral") },
        { key: "report", label: "Assessment Report Link",
          render: () => `<a class="link-external" href="#">View Report ${icon("external", 13)}</a>` },
      ],
      onSelection(sel) {
        const bar = document.getElementById("bulk-bar");
        bar.hidden = sel.length === 0;
        document.getElementById("bulk-count").textContent =
          `${sel.length} VA${sel.length === 1 ? "" : "s"} selected`;
      },
    });

    document.getElementById("app-search")
      .addEventListener("input", (e) => appTable.search(e.target.value));
    document.getElementById("bulk-clear")
      .addEventListener("click", () => appTable.clearSelection());
    document.getElementById("bulk-apply").addEventListener("click", () => {
      const stage = document.getElementById("bulk-stage").value;
      if (!stage) { toast("Selecciona un stage antes de aplicar", "error"); return; }
      toast(`Stage “${stage}” aplicado a ${appTable.selection().length} VA(s)`, "success");
      appTable.clearSelection();
    });
    document.getElementById("download-csv").addEventListener("click", () => {
      const rows = [["VA Name", "Email", "Assessment", "Score", "Status"]]
        .concat(D.applications.map((r) => [r.name, r.email, r.assessment, r.score + "%", r.status]));
      const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      const a = Object.assign(document.createElement("a"), { href: url, download: "job-applications.csv" });
      a.click();
      URL.revokeObjectURL(url);
      toast("CSV generado", "success");
    });

    /* --- Filtros de aplicaciones -------------------------------------------- */
    const fill = (id, values) => {
      const sel = document.getElementById(id);
      values.forEach((v) => sel.append(new Option(v, v)));
    };
    fill("af-template", D.options.emailTemplate);
    fill("af-stage",    D.options.jobStage);
    fill("af-other",    D.options.otherJobStatus);
    fill("af-country",  D.options.country);
    fill("af-degree",   D.options.degree);
    fill("af-exp",      D.options.experience);

    const appFilters = modal("app-filters");
    document.getElementById("open-app-filters").addEventListener("click", appFilters.open);
    document.getElementById("af-apply").addEventListener("click", () => {
      appFilters.close();
      toast("Filtros aplicados a la tabla de aplicaciones", "success");
    });
    document.getElementById("af-reset").addEventListener("click", () => {
      ["af-template","af-stage","af-other","af-country","af-degree","af-exp","af-rate","af-client-rate","af-date"]
        .forEach((id) => { document.getElementById(id).value = ""; });
      toast("Filtros restablecidos");
    });

    /* --- Tabla de agreements ------------------------------------------------ */
    const agrTable = dataTable({
      mount: document.getElementById("agr-table"),
      rows: D.agreements.map((a, i) => ({ id: "agr-" + i, ...a })),
      pageSize: 10,
      searchFn: (r, t) => (r.name + " " + r.legalName).toLowerCase().includes(t),
      columns: [
        { key: "name", label: "Agreement Name", sortable: true },
        { key: "number", label: "Agreement Number", sortable: true },
        { key: "legalName", label: "VA Legal Name", sortable: true },
        { key: "action", label: "Action",
          render: () => `<a class="link-external" href="#">Link ${icon("external", 13)}</a>` },
      ],
      emptyText: "No agreements yet for this deal.",
    });
    document.getElementById("agr-search")
      .addEventListener("input", (e) => agrTable.search(e.target.value));

    /* --- Cierre del job post ------------------------------------------------ */
    const closeBtn = document.getElementById("close-job-btn");
    if (closeBtn) {
      const dlg = modal("close-job");
      closeBtn.addEventListener("click", dlg.open);
      document.getElementById("confirm-close").addEventListener("click", () => {
        localStorage.removeItem("vlt-job-posted");
        dlg.close();
        toast("Job post cerrado", "success");
        setTimeout(() => location.reload(), 700);
      });
    }

    VLT.init("deals");
  })();
  </script>
</body>
</html>
