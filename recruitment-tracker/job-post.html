<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Post · Recruitment Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css?v=1">
  <link rel="stylesheet" href="assets/css/app.css?v=1">
</head>
<body>
  <main class="page stack" id="page"></main>

  <dialog class="modal modal--sm" id="cancel-dialog">
    <div class="modal__inner">
      <div class="modal__header"><h2 class="modal__title">Cancel job creation?</h2></div>
      <p class="muted">The information you entered will be lost. This action can’t be undone.</p>
      <div class="modal__footer">
        <button class="btn btn--neutral" type="button" data-close>Keep editing</button>
        <button class="btn btn--danger" type="button" id="confirm-cancel">Discard</button>
      </div>
    </div>
  </dialog>

  <dialog class="modal modal--sm" id="publish-dialog">
    <div class="modal__inner">
      <div class="modal__header"><h2 class="modal__title">Publish this job post?</h2></div>
      <p class="muted">Once published, VAs will be able to see the position and apply to it.</p>
      <div class="modal__footer">
        <button class="btn btn--neutral" type="button" data-close>Cancel</button>
        <button class="btn btn--primary" type="button" id="confirm-publish">Publish Job Post</button>
      </div>
    </div>
  </dialog>

  <script src="assets/js/data.js?v=1"></script>
  <script src="assets/js/app.js?v=1"></script>
  <script>
  (function () {
    const D = window.VLTData;
    const { esc, icon, pageHeader, modal, toast, param } = VLT;

    const dealId = param("id", D.dealDetail.id);
    const deal = D.deals.find((d) => d.id === dealId) || D.deals[0];
    const isEdit = param("mode") === "edit";

    const opts = (list) => list.map((o) => `<option>${esc(o)}</option>`).join("");

    const field = (label, control, { required = true, span = 1 } = {}) => `
      <label class="field${span > 1 ? " span-" + span : ""}">
        <span class="field__label">${esc(label)}${required ? '<span class="req">*</span>' : ""}</span>
        ${control}
      </label>`;

    document.getElementById("page").innerHTML = `
      ${pageHeader({
        title: deal.name,
        subtitle: "Assessment Based Application",
        breadcrumb: [{ label: "Home", href: "dashboard.html" }, { label: "Deals", href: "deals.html" }],
      })}

      <div class="card card--pad stack">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <h2 class="h2">Main Job Details</h2>
          <div class="table-toolbar__spacer"></div>
          <button class="btn btn--outline" type="button" id="cancel-btn">Cancel</button>
          <button class="btn btn--primary" type="button" id="publish-btn">
            ${isEdit ? "Update Job Post" : "Publish Job Post"}
          </button>
        </div>

        <form id="job-form" class="stack" novalidate>
          <!-- Tipo de aplicación -->
          <div class="form-section">
            <div class="field">
              <span class="field__label">Application Type</span>
              <div style="display:flex;gap:24px;align-items:center">
                <label class="radio">
                  <input type="radio" name="apptype" value="assessment" checked ${isEdit ? "disabled" : ""}>
                  Assessment Based
                </label>
                <label class="radio">
                  <input type="radio" name="apptype" value="proposal" ${isEdit ? "disabled" : ""}>
                  Proposal Based
                </label>
              </div>
              ${isEdit ? '<span class="field__hint">En modo edición el tipo de aplicación queda bloqueado.</span>' : ""}
            </div>

            <div class="field">
              <span class="field__label">Job Posting Attributes</span>
              <div style="display:flex;gap:24px;align-items:center">
                <label class="checkbox"><input type="checkbox" checked> Featured Job</label>
                <label class="checkbox"><input type="checkbox" checked> Portfolio URL Required</label>
              </div>
            </div>

            <div class="form-grid form-grid--2">
              ${field("Job Post Title", '<input class="input" name="title" placeholder="Full-time (Starting with Part-time)">')}
              ${field("Job ID", '<input class="input" name="jobid" placeholder="Full-time (Starting with Part-time)">')}
            </div>

            <div class="form-grid">
              ${field("VA Level", `<select class="select" name="valevel"><option value="">Select an option</option>${opts(D.options.vaLevel)}</select>`, { span: 3 })}
              ${field("JP Client Information", '<textarea class="textarea" name="clientinfo" placeholder="Write your message here..."></textarea>', { span: 3 })}
              ${field("JP short Job Description", '<textarea class="textarea" name="shortdesc" placeholder="Write your message here..."></textarea>', { span: 3 })}
            </div>

            <div class="form-grid form-grid--2">
              ${field("Job Opening Industry", `<select class="select" name="industry"><option value="">Select an option</option>${opts(D.options.industry)}</select>`)}
              ${field("Primary Role", `<select class="select" name="primaryrole"><option value="">Select an option</option>${opts(D.primaryRoles)}</select>`)}
            </div>

            <div class="form-grid">
              ${field("JP Minimum EF Set Score", '<select class="select" name="efscore"><option value="">Select an option</option><option>50</option><option>65</option><option>75</option><option>85</option></select>', { required: false, span: 3 })}
            </div>

            <div class="form-grid form-grid--2">
              ${field("Job Opening Software Skills", '<input class="input" name="softskills" placeholder="Select options">')}
              ${field("Job Opening Skills", '<input class="input" name="skills" placeholder="Select options">')}
            </div>

            <div class="form-grid">
              ${field("JP Languages", `<select class="select" name="languages"><option value="">Select options</option>${opts(D.options.languages)}</select>`)}
              ${field("Job Opening Deadline", '<input class="input" name="deadline" type="date">')}
              ${field("Date to Hide Job On", '<input class="input" name="hidedate" type="date">')}
              ${field("Job Post Note", '<textarea class="textarea" name="note" placeholder="Write your message here..."></textarea>', { required: false, span: 3 })}
            </div>
          </div>

          <!-- Detalles adicionales -->
          <div class="form-section">
            <h3 class="form-section__title">Additional Job Details</h3>
            <div class="form-grid">
              ${field("Time Zone Availability", '<input class="input" name="timezone" placeholder="9 am - 1 pm">')}
              ${field("Job Opening Weekly Hours", '<input class="input" name="weeklyhours" placeholder="40 hrs">')}
              ${field("Schedule", `<select class="select" name="schedule">${opts(D.options.schedule)}</select>`)}
            </div>
          </div>

          <!-- Tareas -->
          <div class="form-section">
            <h3 class="form-section__title">Tasks Required for the Job</h3>
            <div class="form-grid">
              ${field("Primary Task", '<textarea class="textarea" name="primarytask" placeholder="Write your message here..."></textarea>', { span: 3 })}
              ${field("JP Requirements", '<textarea class="textarea" name="requirements" placeholder="Write your message here..."></textarea>', { span: 3 })}
              ${field("JP Portfolio Guidelines & Tips", '<textarea class="textarea" name="portfolio" placeholder="Write your message here..."></textarea>', { required: false, span: 3 })}
              ${field("JP Ideal Qualifications", '<textarea class="textarea" name="qualifications" placeholder="Write your message here..."></textarea>', { required: false, span: 3 })}
            </div>
          </div>

          <!-- Budget -->
          <div class="form-section">
            <h3 class="form-section__title">Budget</h3>
            <div class="form-grid">
              ${field("Number of VAs Client is looking to hire", '<input class="input" name="vacount" type="number" min="1" value="2">')}
              ${field("Client Rate Min", '<input class="input" name="clientmin" placeholder="11 USD">')}
              ${field("Client Rate Max", '<input class="input" name="clientmax" placeholder="20 USD">')}
              ${field("VA Rate Min", '<input class="input" name="vamin" placeholder="7 USD">')}
              ${field("VA Rate Max", '<input class="input" name="vamax" placeholder="11 USD">')}
            </div>
          </div>

          <!-- Assessments -->
          <div class="form-section">
            <h3 class="form-section__title">Assessments</h3>
            <div class="form-grid form-grid--2">
              ${field("Assessment Title", '<input class="input" name="assessmenttitle" value="Web Developer - Professional">', { required: false })}
              ${field("Assessment Threshold", '<input class="input" name="threshold" value="5%">', { required: false })}
            </div>
          </div>
        </form>
      </div>`;

    /* --- Cancelar ----------------------------------------------------------- */
    const cancelDlg = modal("cancel-dialog");
    document.getElementById("cancel-btn").addEventListener("click", cancelDlg.open);
    document.getElementById("confirm-cancel").addEventListener("click", () => {
      cancelDlg.close();
      location.href = `deal.html?id=${encodeURIComponent(deal.id)}&tab=job`;
    });

    /* --- Publicar ----------------------------------------------------------- */
    const publishDlg = modal("publish-dialog");
    const form = document.getElementById("job-form");

    document.getElementById("publish-btn").addEventListener("click", () => {
      // Validación mínima: los campos marcados como requeridos deben tener valor.
      const missing = Array.from(form.querySelectorAll(".field")).filter((f) => {
        if (!f.querySelector(".req")) return false;
        const control = f.querySelector("input, select, textarea");
        return control && !control.value.trim();
      });
      if (missing.length) {
        toast(`Faltan ${missing.length} campo(s) obligatorio(s)`, "error");
        missing[0].querySelector("input, select, textarea").focus();
        return;
      }
      publishDlg.open();
    });

    document.getElementById("confirm-publish").addEventListener("click", () => {
      publishDlg.close();
      localStorage.setItem("vlt-job-posted", "1");
      toast(isEdit ? "Job post actualizado" : "Job post publicado", "success");
      setTimeout(() => {
        location.href = `deal.html?id=${encodeURIComponent(deal.id)}&tab=job`;
      }, 900);
    });

    VLT.init("deals");
  })();
  </script>
</body>
</html>
