<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deals · Recruitment Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css?v=6">
  <link rel="stylesheet" href="assets/css/app.css?v=6">
</head>
<body>
  <main class="page stack" id="page"></main>

  <!-- Filtros de Deals -->
  <dialog class="modal modal--md" id="deal-filters">
    <form class="modal__inner" method="dialog">
      <div class="modal__header">
        <h2 class="modal__title">Filters</h2>
        <button class="modal__close" type="button" data-close aria-label="Cerrar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="form-grid form-grid--2">
        <label class="field"><span class="field__label">Deal Stage</span>
          <select class="select" id="f-stage"><option value="">All</option></select></label>

        <label class="field"><span class="field__label">Delivery Date</span>
          <input class="input" id="f-date" type="date"></label>

        <label class="field"><span class="field__label">Primary Role</span>
          <select class="select" id="f-role"><option value="">All</option></select></label>

        <label class="field"><span class="field__label">Deal Owner</span>
          <select class="select" id="f-owner"><option value="">All</option></select></label>

        <label class="field"><span class="field__label">Job Posted</span>
          <select class="select" id="f-jobposted">
            <option value="">All</option>
            <option value="yes">Job Posted</option>
            <option value="no">Job Not Posted</option>
          </select></label>

        <label class="field"><span class="field__label">RT Pod</span>
          <select class="select" id="f-pod"><option value="">All</option></select></label>

        <label class="field"><span class="field__label">Agent</span>
          <select class="select" id="f-agent"><option value="">All</option></select></label>

        <label class="field"><span class="field__label">Specialist</span>
          <select class="select" id="f-specialist"><option value="">All</option></select></label>
      </div>

      <div class="modal__footer">
        <button class="btn btn--outline" type="button" id="f-reset">Reset</button>
        <button class="btn btn--primary" type="button" id="f-apply">Apply Filter</button>
      </div>
    </form>
  </dialog>

  <script src="assets/js/data.js?v=6"></script>
  <script src="assets/js/app.js?v=6"></script>
  <script>
  (function () {
    const D = window.VLTData;
    const { esc, icon, badge, pageHeader, dataTable, modal, toast } = VLT;

    document.getElementById("page").innerHTML = `
      ${pageHeader({ title: "Deals" })}

      <section class="card card--pad">
        <div class="table-toolbar">
          <div class="field">
            <span class="field__label">Search Deals</span>
            <span class="search">${icon("search", 16)}
              <input class="input" id="search" type="search" placeholder="Enter deal's name or deal id">
            </span>
          </div>
          <button class="btn btn--outline" id="open-filters" type="button">
            ${icon("sort", 16)} Filters
          </button>
        </div>
        <div id="table"></div>
      </section>`;

    const columns = [
      { key: "id",   label: "Deal ID", sortable: true },
      { key: "name", label: "Deal Name", sortable: true,
        render: (r) => `<a class="cell-link" href="deal.html?id=${esc(r.id)}">${esc(r.name)}</a>` },
      { key: "stage",    label: "Deal Stage", sortable: true },
      { key: "delivery", label: "Delivery Date", sortable: true },
      { key: "role",     label: "Primary Role", sortable: true },
      { key: "owner",    label: "Deal Owner", sortable: true },
      { key: "jobPosted", label: "Job Posted", sortable: true,
        render: (r) => r.jobPosted ? badge("Job Posted", "success") : badge("Job Not Posted", "error") },
      { key: "action", label: "Action", align: "right",
        render: (r) => `<a class="icon-button icon-button--quiet" href="deal.html?id=${esc(r.id)}"
                          title="View Deal" aria-label="View Deal">${icon("eye", 18)}</a>` },
    ];

    const table = dataTable({
      mount: document.getElementById("table"),
      rows: D.deals,
      columns,
      pageSize: 10,
      searchFn: (r, t) => (r.name + " " + r.id + " " + r.role).toLowerCase().includes(t),
    });

    document.getElementById("search")
      .addEventListener("input", (e) => table.search(e.target.value));

    /* --- Filtros ----------------------------------------------------------- */
    const fill = (id, values) => {
      const sel = document.getElementById(id);
      values.forEach((v) => sel.append(new Option(v, v)));
    };
    fill("f-stage",      D.dealStages);
    fill("f-role",       D.primaryRoles);
    fill("f-owner",      D.dealOwners);
    fill("f-pod",        D.rtPods);
    fill("f-agent",      D.agents);
    fill("f-specialist", D.specialists);

    const filters = modal("deal-filters");
    document.getElementById("open-filters").addEventListener("click", filters.open);

    const FIELDS = ["f-stage", "f-date", "f-role", "f-owner",
                    "f-jobposted", "f-pod", "f-agent", "f-specialist"];
    const val = (id) => document.getElementById(id).value;

    document.getElementById("f-apply").addEventListener("click", () => {
      const rows = D.deals.filter((d) =>
        (!val("f-stage")      || d.stage === val("f-stage")) &&
        (!val("f-date")       || d.delivery >= val("f-date")) &&
        (!val("f-role")       || d.role === val("f-role")) &&
        (!val("f-owner")      || d.owner === val("f-owner")) &&
        (!val("f-jobposted")  || d.jobPosted === (val("f-jobposted") === "yes")) &&
        (!val("f-pod")        || d.rtPod === val("f-pod")) &&
        (!val("f-agent")      || d.agent === val("f-agent")) &&
        (!val("f-specialist") || d.specialist === val("f-specialist")));
      table.setRows(rows);
      filters.close();
      toast(`${rows.length} deal(s) coinciden con el filtro`, "success");
    });

    document.getElementById("f-reset").addEventListener("click", () => {
      FIELDS.forEach((id) => { document.getElementById(id).value = ""; });
      VLT.syncSelects();
      table.setRows(D.deals);
      toast("Filtros restablecidos");
    });

    VLT.init("deals");
  })();
  </script>
</body>
</html>
