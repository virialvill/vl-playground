<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Recruitment Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css?v=1">
  <link rel="stylesheet" href="assets/css/app.css?v=1">
</head>
<body>
  <main class="page stack" id="page"></main>

  <!-- Filtros de deals -->
  <dialog class="modal" id="deal-filters">
    <form class="modal__inner" method="dialog">
      <div class="modal__header">
        <h2 class="modal__title">Filters</h2>
        <button class="modal__close" type="button" data-close aria-label="Cerrar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <p class="modal__group-title">Deal Information</p>
      <div class="form-grid">
        <label class="field">
          <span class="field__label">Deal Stage</span>
          <select class="select" id="f-stage"><option value="">Select</option></select>
        </label>
        <label class="field">
          <span class="field__label">Primary Role</span>
          <select class="select" id="f-role"><option value="">Select</option></select>
        </label>
        <label class="field">
          <span class="field__label">Deal Owner</span>
          <select class="select" id="f-owner"><option value="">Select</option></select>
        </label>
      </div>

      <p class="modal__group-title" style="margin-top:20px">Publication</p>
      <div class="form-grid">
        <label class="field">
          <span class="field__label">Status Deal</span>
          <select class="select" id="f-published">
            <option value="">Select</option>
            <option value="yes">Published Deal</option>
            <option value="no">Unpublished Deal</option>
          </select>
        </label>
        <label class="field">
          <span class="field__label">Job Posted</span>
          <select class="select" id="f-jobposted">
            <option value="">Select</option>
            <option value="yes">Job Posted</option>
            <option value="no">Job Not Posted</option>
          </select>
        </label>
      </div>

      <div class="modal__footer">
        <button class="btn btn--outline" type="button" id="f-reset">Reset</button>
        <button class="btn btn--primary" type="button" id="f-apply">Apply Filter</button>
      </div>
    </form>
  </dialog>

  <script src="assets/js/data.js?v=1"></script>
  <script src="assets/js/app.js?v=1"></script>
  <script>
  (function () {
    const D = window.VLTData;
    const { esc, icon, badge, avatar, pageHeader, dataTable, modal, toast, formatDate } = VLT;

    const published   = D.deals.filter((d) => d.published).length;
    const unpublished = D.deals.length - published;

    document.getElementById("page").innerHTML = `
      ${pageHeader({
        title: `Welcome Back ${D.currentUser.name}!`,
        avatarText: D.currentUser.initials,
        badge: { text: D.currentUser.role, tone: "primary" },
      })}

      <section class="stack-s">
        <h2 class="h2">My Deals</h2>
        <div class="kpi-grid">
          <article class="kpi">
            <span class="kpi__icon">${icon("file-check", 28)}</span>
            <span class="kpi__value">${published}</span>
            <span class="kpi__label">Published Deals</span>
          </article>
          <article class="kpi">
            <span class="kpi__icon">${icon("file-x", 28)}</span>
            <span class="kpi__value">${unpublished}</span>
            <span class="kpi__label">Unpublished Deals</span>
          </article>
        </div>
      </section>

      <section class="card card--pad">
        <div class="table-toolbar">
          <div class="field">
            <span class="field__label">Search Deals</span>
            <span class="search">${icon("search", 16)}
              <input class="input" id="search" type="search" placeholder="Enter deal's name or deal id">
            </span>
          </div>
          <button class="btn btn--outline" id="open-filters" type="button">
            ${icon("sort", 16)} Filters ${icon("chevronDown", 14)}
          </button>
        </div>
        <div id="table"></div>
      </section>`;

    const columns = [
      { key: "id",   label: "Deal ID", sortable: true },
      { key: "name", label: "Deal Name", sortable: true,
        render: (r) => `<a class="cell-link" href="deal.html?id=${esc(r.id)}">${esc(r.name)}</a>` },
      { key: "stage", label: "Deal Stage", sortable: true },
      { key: "role",  label: "Primary Role", sortable: true },
      { key: "owner", label: "Deal Owner", sortable: true },
      { key: "published", label: "Status Deal", sortable: true,
        render: (r) => r.published ? badge("Published Deal", "success") : badge("Unpublished Deal", "error") },
      { key: "jobPosted", label: "Job Posted", sortable: true,
        render: (r) => r.jobPosted ? badge("Job Posted", "success") : badge("Job Not Posted", "error") },
      { key: "action", label: "Action", align: "right",
        render: (r) => `<a class="icon-button" href="deal.html?id=${esc(r.id)}" title="View Deal"
                          aria-label="View Deal">${icon("eye", 16)}</a>` },
    ];

    const table = dataTable({
      mount: document.getElementById("table"),
      rows: D.deals,
      columns,
      pageSize: 10,
      searchFn: (r, t) => (r.name + " " + r.id).toLowerCase().includes(t),
    });

    document.getElementById("search")
      .addEventListener("input", (e) => table.search(e.target.value));

    // --- Filtros -----------------------------------------------------------
    const fill = (id, values) => {
      const sel = document.getElementById(id);
      values.forEach((v) => sel.append(new Option(v, v)));
    };
    fill("f-stage", D.dealStages);
    fill("f-role",  D.primaryRoles);
    fill("f-owner", D.dealOwners);

    const filters = modal("deal-filters");
    document.getElementById("open-filters").addEventListener("click", filters.open);

    const readFilter = (id) => document.getElementById(id).value;
    document.getElementById("f-apply").addEventListener("click", () => {
      const stage = readFilter("f-stage"), role = readFilter("f-role"),
            owner = readFilter("f-owner"), pub = readFilter("f-published"),
            job = readFilter("f-jobposted");
      const rows = D.deals.filter((d) =>
        (!stage || d.stage === stage) &&
        (!role  || d.role === role) &&
        (!owner || d.owner === owner) &&
        (!pub   || d.published === (pub === "yes")) &&
        (!job   || d.jobPosted === (job === "yes")));
      table.setRows(rows);
      filters.close();
      toast(`${rows.length} deal(s) coinciden con el filtro`, "success");
    });

    document.getElementById("f-reset").addEventListener("click", () => {
      ["f-stage", "f-role", "f-owner", "f-published", "f-jobposted"]
        .forEach((id) => { document.getElementById(id).value = ""; });
      table.setRows(D.deals);
      toast("Filtros restablecidos");
    });

    VLT.init("dashboard");
  })();
  </script>
</body>
</html>
